# Database release gate (docs/DATABASE_TESTING_STRATEGY.md section 6).
# NOTE: authored without the ability to run GitHub Actions; the first run on GitHub is the verification.
name: database

on:
  pull_request:
    paths: ['supabase/**', 'tests/**', 'docs/PERMISSIONS_MATRIX.md', 'docs/RLS_SECURITY_SPECIFICATION.md', 'scripts/**', 'package.json', '.github/workflows/database.yml']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Type-check tests
        run: npx tsc --noEmit -p .
      - name: Permission seed matches docs/PERMISSIONS_MATRIX.md (MTX-01)
        run: npm run check:matrix
      - name: No service-role key or secret-looking literals committed (SEC-01)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Start local Supabase (Auth, PostgREST, Storage, Realtime)
        run: supabase start
      - name: Reset database from migrations and synthetic seed
        run: supabase db reset
      - name: Lint database
        run: supabase db lint --level warning --fail-on error
      - name: pgTAP catalogue and trigger tests (CAT-*, INT-*, DEF-*)
        run: supabase test db
      - name: API security suite with real JWTs (ISO, SCP, INV, MUL, MEM, FIL, RT, AUDIT, MTX)
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm test
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
